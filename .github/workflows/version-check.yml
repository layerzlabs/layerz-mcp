name: version check
# The manifests here mirror the server version published to the MCP registry
# (see README § Versioning). Runs on every push and weekly, since the registry
# side changes without a commit here.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs
